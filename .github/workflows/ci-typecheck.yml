name: CI Typecheck

on:
  workflow_call:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    container: python:3.11-slim
    env:
      UV_PROJECT_ENVIRONMENT: .venv
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Create venv
        run: uv venv

      - name: Sync dependencies
        run: uv sync --extra dev --frozen

      - name: MyPy
        run: uv run mypy src
