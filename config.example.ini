# Instagram Media Downloader - Beispiel-Konfiguration
# =======================================================
# Kopiere diese Datei nach config.ini und passe die Werte an
# Verwendung: instagram-downloader saved --config config.ini

[DEFAULT]
# Instagram-Username (wird für Datenpfade verwendet)
username = skymuss

# Verzeichnis mit Instagram-Export-Daten
# data_dir = /pfad/zum/instagram-export/data

# Ziel-Verzeichnis für Downloads
# download_dir = /pfad/zum/download/ordner

# State-Verzeichnis (für Resume-Funktionalität)
# state_dir = ./state

# Verzögerung zwischen Downloads (in Sekunden)
# Erhöhe diesen Wert bei Rate-Limit-Problemen
request_delay = 1.0

# Maximale Anzahl von Wiederholungsversuchen bei Fehlern
max_retries = 3

# Verzögerung zwischen Wiederholungsversuchen (in Sekunden)
retry_delay = 5.0

# Timeout für einzelne Downloads (in Sekunden)
timeout = 60

# Anzahl paralleler Downloads (noch nicht implementiert)
# parallel_downloads = 1

# Log-Level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
log_level = INFO

# CSV-Export aktivieren/deaktivieren
csv_export = true
