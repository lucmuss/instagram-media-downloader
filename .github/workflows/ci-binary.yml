name: CI Binary

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.12"

jobs:
  binary:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      UV_PROJECT_ENVIRONMENT: .venv
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Create venv
        run: uv venv

      - name: Sync dependencies
        run: uv sync --extra dev --frozen

      - name: Build binary
        run: uv run --with pyinstaller pyinstaller -F -n instagram-downloader src/instagram_downloader/__main__.py

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: instagram-downloader-${{ matrix.os }}
          path: dist
