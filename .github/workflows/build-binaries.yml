name: Build Binaries

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/ci-binary.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
